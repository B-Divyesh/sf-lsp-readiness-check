[package]
name = "lsp-readiness-check"
version = "0.1.0"
edition = "2024"
description = "Verify repository language tooling before an agent edits code"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-lsp-readiness-check"
readme = "README.md"

[[bin]]
name = "lsp-readiness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

